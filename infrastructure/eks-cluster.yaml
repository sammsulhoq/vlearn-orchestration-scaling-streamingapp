apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: herovired-streamingapp
  region: ap-south-1
  version: "1.35"
  tags:
    Project: streamingapp
    Environment: training

iam:
  withOIDC: true

vpc:
  id: vpc-098dc930c1452662f
  subnets:
    public:
      ap-south-1a:
        id: subnet-0ae01f8f90686afcb
      ap-south-1b:
        id: subnet-0dd5a3252139bda8c
      ap-south-1c:
        id: subnet-04f60e764bb47c089
  clusterEndpoints:
    publicAccess: true
    privateAccess: true
  publicAccessCIDRs:
    - "106.51.214.100/32"

managedNodeGroups:
  - name: streamingapp-workers
    instanceType: t3.medium
    amiFamily: AmazonLinux2023
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 30
    volumeType: gp3
    privateNetworking: false
    ssh:
      allow: false
    labels:
      project: streamingapp
    tags:
      Project: streamingapp

cloudWatch:
  clusterLogging:
    enableTypes:
      - api
      - audit
      - authenticator
      - controllerManager
      - scheduler
    logRetentionInDays: 7
